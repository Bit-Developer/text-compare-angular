trigger:
- main

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: '20.x'
  npm_config_cache: $(Pipeline.Workspace)/.npm

stages:
- stage: Build
  displayName: 'Build (CI)'
  jobs:
  - job: build
    displayName: 'Install, Lint, Test, Build'
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'
      displayName: 'Use Node.js $(nodeVersion)'

    - task: Cache@2
      inputs:
        key: 'npm | \"$(Agent.OS)\" | package-lock.json'
        path: $(npm_config_cache)
        restoreKeys: |
          npm | \"$(Agent.OS)\"
      displayName: 'Cache npm'

    - script: npm ci
      displayName: 'npm ci'

    - script: npx -y @angular/cli@$(nodeVersion) version || true && npm run lint
      displayName: 'Run lint'

    - script: npm run test-headless -- --no-watch --browsers=ChromeHeadless
      displayName: 'Run unit tests (headless)'

    - script: npm run build -- --configuration production
      displayName: 'Build (production)'

    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/dist
        if [ -d dist/text-compare-angular ]; then
          cp -r dist/text-compare-angular/* $(Build.ArtifactStagingDirectory)/dist/
        else
          cp -r dist/* $(Build.ArtifactStagingDirectory)/dist/
        fi
      displayName: 'Stage build artifacts'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/dist'
        artifact: 'app-dist'
      displayName: 'Publish pipeline artifact'

- stage: E2E
  displayName: 'E2E Tests'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: e2e
    displayName: 'Run e2e tests'
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'
    - download: current
      artifact: app-dist
      displayName: 'Download build artifact'
    - script: |
        npm ci
        # run e2e (ensure protractor and ts-node present)
        npm run e2e
      displayName: 'Run e2e tests'
      # Optionally add timeouts or test flakiness retries here

- stage: Deploy_Staging
  displayName: 'Deploy to Staging'
  dependsOn: E2E
  condition: succeeded()
  jobs:
  - deployment: deploy
    displayName: 'Deploy artifact to staging environment'
    environment: 'staging'          # configure environment in ADO; set approvals here
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: app-dist
            displayName: 'Download build artifact'
          - script: |
              echo "Deploying to staging..."
              ls -la $(Pipeline.Workspace)
              # replace the following with your real deploy e.g., az webapp deploy, scp, kubectl, helm, etc.
              mkdir -p $(Build.ArtifactStagingDirectory)/release
              cp -r $(Pipeline.Workspace)/app-dist/* $(Build.ArtifactStagingDirectory)/release/
            displayName: 'Deploy steps (placeholder)'