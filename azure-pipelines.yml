# Node.js with Angular
# Build a Node.js project that uses Angular.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'
  npm_config_cache: $(Pipeline.Workspace)/.npm

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '$(nodeVersion)'
  displayName: 'Use Node.js $(nodeVersion)'

# Cache node_modules between runs (uses pipeline cache)
- task: Cache@2
  inputs:
    key: 'npm | "$(Agent.OS)" | package-lock.json'
    path: $(npm_config_cache)
    restoreKeys: |
      npm | "$(Agent.OS)"
  displayName: 'Cache npm'

- script: |
    npm ci
  displayName: 'Install dependencies (npm ci)'

- script: |
    npx -y @angular/cli@$(nodeVersion) version || true
    npm run lint
  displayName: 'Run lint'

- script: |
    # Run unit tests in headless Chrome and produce coverage
    npm run test-headless -- --no-watch --browsers=ChromeHeadless
  displayName: 'Run unit tests (headless)'

# Build only on main branch (triggered by CI)
- script: |
    npm run build -- --configuration production
  displayName: 'Build (production)'
  condition: eq(variables['Build.SourceBranchName'], 'main')

# Stage build outputs into the artifact staging directory and publish
- script: |
    echo "Staging build artifacts..."
    mkdir -p "$(Build.ArtifactStagingDirectory)/dist"
    if [ -d "dist/text-compare-angular" ]; then
      cp -r dist/text-compare-angular/* "$(Build.ArtifactStagingDirectory)/dist/"
    elif [ -d "dist" ]; then
      cp -r dist/* "$(Build.ArtifactStagingDirectory)/dist/"
    else
      echo "No dist folder found after build"
      ls -la
    fi
  displayName: 'Stage build artifacts'
  condition: eq(variables['Build.SourceBranchName'], 'main')

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/dist'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish dist artifact'
  condition: eq(variables['Build.SourceBranchName'], 'main')
